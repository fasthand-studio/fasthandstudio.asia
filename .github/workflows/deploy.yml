name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # bun.lock is the committed lockfile; npm has no lock here and chokes on install.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --no-frozen-lockfile
      - run: bun run build
      # GitHub Pages serves files only: unknown paths fall back to this copy of
      # the home page, and the client router resolves or 404s from there.
      - run: cp dist/client/index.html dist/client/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
